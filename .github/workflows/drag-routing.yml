name: Upstream drag routing
on:
  pull_request:
permissions:
  contents: read
jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build:web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
          python tests/drag_router_browser.py
      - name: Retain exact routing test inputs
        if: always()
        run: |
          mkdir -p .ci/upstream-router
          cp package-lock.json .ci/upstream-router/
          tar -czf .ci/upstream-router/dependencies.tar.gz node_modules web/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-router-inputs
          path: .ci/upstream-router
          retention-days: 7
