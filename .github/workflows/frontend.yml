name: Frontend dependencies
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build offline SVG adapter
        run: npm run build:web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise the SVG security and compatibility boundary
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
          python tests/svg_browser.py
      - name: Package reproducible review inputs
        if: always()
        run: |
          mkdir -p .ci/frontend
          git archive --format=tar HEAD > .ci/frontend/source.tar
          cp package-lock.json .ci/frontend/
          cp -R web/dist .ci/frontend/
          tar -czf .ci/frontend/npm-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-review-inputs
          path: .ci/frontend
          retention-days: 7
