# Temporary, branch-scoped verification environment. Removed before final delivery.
name: Routing workbench
on:
  push:
    branches: [codex/issue-5-obstacle-routing]
    paths: [.github/workflows/routing-workbench.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Prepare remaining native runtime and Typst package cache
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/route-extra"
          mkdir -p "$out/lib" "$out/typst" "$out/package-cache"
          cp -L "$(rustc --print sysroot)/lib/"libLLVM.so.* "$out/lib/"
          curl --fail --location --retry 3 https://github.com/typst/typst/releases/download/v0.14.2/typst-x86_64-unknown-linux-musl.tar.xz -o "$RUNNER_TEMP/typst.tar.xz"
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" --strip-components=1 -C "$out/typst"
          for src in examples/*.typ; do
            "$out/typst/typst" compile --root . --package-cache-path "$out/package-cache" --format svg "$src" "$RUNNER_TEMP/$(basename "$src").svg"
          done
          tar -czf "$RUNNER_TEMP/routing-extra.tgz" -C "$RUNNER_TEMP" route-extra
      - uses: actions/upload-artifact@v4
        with:
          name: routing-workbench-extra
          path: ${{ runner.temp }}/routing-extra.tgz
          retention-days: 1
          compression-level: 0
