name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TYPST_VERSION: 0.14.2

jobs:
  rust-and-typst:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install frontend build runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build local frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build:web

      - name: Install stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install pinned Typst release
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}:${RUNNER_ARCH}" in
            Linux:X64)
              target="x86_64-unknown-linux-musl"
              ;;
            macOS:X64)
              target="x86_64-apple-darwin"
              ;;
            macOS:ARM64)
              target="aarch64-apple-darwin"
              ;;
            *)
              echo "Unsupported runner: ${RUNNER_OS}:${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac
          archive="${RUNNER_TEMP}/typst-${target}.tar.xz"
          install_dir="${RUNNER_TEMP}/typst"
          mkdir -p "${install_dir}"
          curl --fail --location --retry 3 \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-${target}.tar.xz" \
            --output "${archive}"
          tar -xJf "${archive}" --strip-components=1 -C "${install_dir}"
          test -x "${install_dir}/typst"
          export PATH="${install_dir}:${PATH}"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/typst" --version

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check all Rust targets
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cetz-studio-target
        run: cargo check --locked --all-targets

      - name: Run Clippy
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cetz-studio-target
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cetz-studio-target
        run: cargo test --locked --all-targets

      - name: Run native Typst round-trip tests
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cetz-studio-target
          TYPST: typst
        run: cargo test --locked --all-targets -- --ignored

      - name: Compile Typst examples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/typst
          shopt -s nullglob
          sources=(examples/*.typ)
          for source in "${sources[@]}"; do
            name="$(basename "${source%.typ}")"
            typst compile --root . --format svg "${source}" ".ci/typst/${name}.svg"
          done

      - name: Check Typst package examples
        run: sh tests/package_compile.sh

      - name: Build native editor
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cetz-studio-target
        run: cargo build --locked

      - name: Install browser test runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Verify browser production and tentative-preview contracts
        run: |
          python tests/svg_browser.py
          python tests/browser_smoke.py
          python tests/controls_browser.py
          python tests/preview_frontend_browser.py
          python tests/responsive_browser.py
          python tests/transparency_browser.py --binary "${{ runner.temp }}/cetz-studio-target/debug/cetz-studio"

      - name: Verify native browser round trips
        run: python tests/native_browser.py --binary "${{ runner.temp }}/cetz-studio-target/debug/cetz-studio"

      - name: Verify native Scenery display controls
        run: python tests/scenery_browser.py --binary "${{ runner.temp }}/cetz-studio-target/debug/cetz-studio" --output-dir .ci/scenery

      - name: Retain Scenery native previews and observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenery-${{ matrix.os }}
          path: .ci/scenery
          if-no-files-found: ignore

      - name: Verify native obstacle-routing browser workflow
        run: python tests/routing_browser.py --binary "${{ runner.temp }}/cetz-studio-target/debug/cetz-studio" --output-dir .ci/routing

      - name: Verify native upstream drag previews
        run: python tests/drag_preview_native.py --binary "${{ runner.temp }}/cetz-studio-target/debug/cetz-studio"

      - name: Retain native upstream drag evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drag-preview-${{ matrix.os }}
          path: .ci/drag-preview
          if-no-files-found: ignore

      - name: Record release deployment size
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cetz-studio-target
        run: |
          cargo build --release --locked
          python -c "from pathlib import Path; print('Native release bytes:', Path('${{ runner.temp }}/cetz-studio-target/release/cetz-studio').stat().st_size)"

      - name: Retain routing screenshots and latency observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-${{ matrix.os }}
          path: .ci/routing
          if-no-files-found: ignore

      - name: Verify project navigation and graph authoring
        run: python tests/workspace_browser.py --binary "${{ runner.temp }}/cetz-studio-target/debug/cetz-studio"

      - name: Compile Typst package examples
        if: hashFiles('typst/**/examples/*.typ') != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/typst/package
          while IFS= read -r source; do
            relative="${source#typst/}"
            name="${relative//\//-}"
            name="${name%.typ}"
            typst compile --root . --format svg "${source}" ".ci/typst/package/${name}.svg"
          done < <(find typst -type f -path '*/examples/*.typ' -print)
