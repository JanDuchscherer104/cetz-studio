[package]
name = "cetz-studio"
version = "0.1.0"
edition = "2021"
description = "Source-preserving CeTZ and Fletcher figure editor with reusable Typst primitives"
license = "MIT"
publish = false

[lib]
name = "cetz_studio"
path = "src/lib.rs"

[[bin]]
name = "cetz-studio"
path = "src/main.rs"

[dependencies]
pathfinding = "=4.15.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.7"
tempfile = "3.20"
tiny_http = "0.12"
typst-syntax = "=0.14.2"
uuid = { version = "1.16", features = ["v4"] }
wait-timeout = "0.2"
roxmltree = "0.20"

[profile.release]
strip = true
lto = "thin"
